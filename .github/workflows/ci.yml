name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq zsh

      - name: Shell tests and shellcheck
        run: ./tests/run.sh

      - name: Every committed profile plans cleanly
        run: |
          for p in profiles/*.sh; do
            name="$(basename "$p" .sh)"
            [ "$name" = local ] && continue
            echo "== $name"
            ./install.sh --profile "$name" --dry-run
          done
